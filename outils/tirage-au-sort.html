<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="canonical" href="https://www.outilseps.fr/outils/tirage-au-sort.html" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a2744" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Outils EPS" />
    <title>Tirage au sort — Outils EPS</title>
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="app app--tool">
    <div class="page-outil page-outil--tirage">
      <header class="page-outil__header">
        <a class="tool-back" href="../index.html"
          ><span class="tool-back__chev" aria-hidden="true">‹</span> Accueil</a
        >
        <h1>Tirage au sort</h1>
      </header>

      <p id="tirage-msg" class="msg-error tirage-msg" role="alert" hidden></p>

      <section class="card" aria-labelledby="lbl-liste">
        <h2 id="lbl-liste">Liste des participants</h2>
        <div class="liste-import-toolbar field-row">
          <button type="button" class="btn btn--ghost btn--labeled" id="btn-import-classe-tirage">
            <span class="btn__icon" aria-hidden="true">👥</span>
            <span class="btn__text">Importer depuis une classe</span>
          </button>
          <button type="button" class="btn btn--ghost btn--labeled" id="btn-ajouter-manuel-tirage" aria-expanded="false" aria-controls="liste-manuelle-panel-tirage">
            <span class="btn__icon" aria-hidden="true">✎</span>
            <span class="btn__text">Ajouter manuellement</span>
          </button>
        </div>
        <div id="liste-manuelle-panel-tirage" class="liste-manuelle-panel" hidden>
          <p class="hint liste-manuelle-ligne-hint" hidden>1 participant par ligne. <strong>Valider la liste</strong> ajoute les noms ci-dessous.</p>
          <div class="field-group">
            <label class="field-label field-label--with-meta" for="liste-brute">
              <span class="field-label__main">Ajouter des joueurs ou équipes</span>
              <span class="field-label__meta" id="liste-brute-meta" aria-live="polite"></span>
            </label>
            <textarea
              id="liste-brute"
              rows="8"
              placeholder="Martin&#10;Léa Dupont&#10;Paul&#10;…"
              spellcheck="false"
            ></textarea>
          </div>
          <div class="field-row tirage-actions-row">
            <button type="button" class="btn btn--primary btn--labeled" id="btn-valider-liste">
              <span class="btn__icon" aria-hidden="true">✓</span>
              <span class="btn__text">Valider la liste</span>
            </button>
          </div>
        </div>
        <div class="field-row tirage-actions-row">
          <button type="button" class="btn btn--danger btn--labeled" id="btn-vider-liste">
            <span class="btn__icon" aria-hidden="true">🗑️</span>
            <span class="btn__text">Vider la liste</span>
          </button>
          <span id="tirage-nb" class="tirage-nb" aria-live="polite">0 participant</span>
        </div>
        <ul id="participants-list" class="tirage-participants" role="list" hidden></ul>
        <p id="participants-empty" class="empty-state">Aucun participant pour le moment.</p>
      </section>

      <section class="card tirage-draw-card" aria-labelledby="lbl-tirage">
        <h2 id="lbl-tirage">Tirage</h2>
        <div id="tirage-resultat" class="tirage-resultat" role="status" aria-live="polite" hidden>
          <span class="tirage-resultat__label">Tiré au sort</span>
          <strong id="tirage-nom" class="tirage-resultat__nom"></strong>
        </div>
        <p id="tirage-resultat-hint" class="hint tirage-resultat-hint">
          Appuyez sur le bouton pour lancer un tirage aléatoire parmi les participants.
        </p>
        <label class="tirage-option">
          <input type="checkbox" id="retirer-apres-tirage" />
          Retirer le tiré de la liste après le tirage
        </label>
        <button type="button" class="btn btn--primary btn--labeled tirage-btn-draw" id="btn-tirer">
          <span class="btn__icon" aria-hidden="true">🎲</span>
          <span class="btn__text">Tirer au sort</span>
        </button>
      </section>
    </div>

    <script src="../data-manager.js"></script>
    <script src="../shared/eleve-display.js"></script>
    <script src="../class-import.js"></script>
    <script src="../shared/import-eleve-presence.js"></script>
    <script src="../shared/liste-saisie-ui.js"></script>
    <script src="../shared/liste-manuelle-panel.js"></script>
    <script src="tirage-au-sort.js"></script>
    <script src="../tool-info.js"></script>
    <script>
      ToolInfo.init({
        intro: "Tirez un nom au hasard, de façon équitable, en cours ou en préparation.",
        sections: [
          {
            title: "L’intérêt principal",
            text:
              "Fini de chercher « au hasard » avec les doigts : l’outil choisit un élève ou un participant pour vous.",
          },
          {
            title: "Comment s’en servir",
            list: [
              "Collez une liste de noms (un par ligne) ou importez des élèves depuis une classe.",
              "Appuyez sur « Tirer au sort » pour afficher le nom choisi.",
              "Vous pouvez retirer le tiré de la liste pour ne pas le retirer deux fois de suite.",
            ],
          },
        ],
      });
    </script>
    <script src="../shared/tool-accueil.js"></script>
    <script src="../goatcounter.js"></script>
    <script src="../pwa-register.js" data-sw="../sw.js"></script>
  </body>
</html>
