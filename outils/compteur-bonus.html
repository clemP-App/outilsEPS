<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a2744" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Outils EPS" />
    <title>Compteur bonus — Outils EPS</title>
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="app app--tool">
    <div class="page-outil page-outil--bonus">
      <header class="page-outil__header page-outil__header--compact">
        <a class="tool-back" href="../index.html"
          ><span class="tool-back__chev" aria-hidden="true">‹</span> Accueil</a
        >
        <h1>Compteur bonus</h1>
      </header>

      <details class="card card--accordion card--accordion-compact" id="accordion-reglages">
        <summary class="card--accordion__summary">
          <span class="card--accordion__title">Paramètres des points</span>
          <span class="card--accordion__chev" aria-hidden="true"></span>
        </summary>
        <div class="card--accordion__panel">
          <p class="hint">
            Définissez combien de points vaut chaque action. Les malus peuvent être négatifs (ex. −1).
          </p>
          <div class="field-row bonus-reglages-row">
            <div class="field-group">
              <label class="field-label" for="pts-bonus">👍 Bonus</label>
              <input type="number" id="pts-bonus" inputmode="decimal" step="any" value="2" />
            </div>
            <div class="field-group">
              <label class="field-label" for="pts-normal">➕ Point</label>
              <input type="number" id="pts-normal" inputmode="decimal" step="any" value="1" />
            </div>
            <div class="field-group">
              <label class="field-label" for="pts-malus">👎 Malus</label>
              <input type="number" id="pts-malus" inputmode="decimal" step="any" value="-1" />
            </div>
          </div>
          <button type="button" class="btn btn--ghost btn--labeled" id="btn-reset-partie">
            <span class="btn__text">Remettre les scores à zéro</span>
          </button>
        </div>
      </details>

      <div class="bonus-play" aria-live="polite">
        <section class="card bonus-joueur bonus-joueur--a" aria-labelledby="lbl-joueur-a">
          <div class="bonus-joueur__head">
            <label class="field-label" for="bonus-name-a">Joueur A</label>
            <input type="text" id="bonus-name-a" class="bonus-joueur__titre-input" maxlength="60" value="Joueur A" aria-labelledby="lbl-joueur-a" />
            <p class="bonus-score-wrap">
              <span class="bonus-score" id="score-a">0</span>
              <span class="bonus-score-unit">pts</span>
            </p>
          </div>
          <div class="bonus-btns" role="group" aria-label="Actions joueur A">
            <button type="button" class="bonus-btn bonus-btn--bonus" data-joueur="A" data-type="bonus">
              <span class="bonus-btn__icon" aria-hidden="true">👍</span>
              <span class="bonus-btn__label">Bonus</span>
              <span class="bonus-btn__detail">0x · 0%</span>
            </button>
            <button type="button" class="bonus-btn bonus-btn--normal" data-joueur="A" data-type="normal">
              <span class="bonus-btn__icon" aria-hidden="true">➕</span>
              <span class="bonus-btn__label">Point</span>
              <span class="bonus-btn__detail">0x · 0%</span>
            </button>
            <button type="button" class="bonus-btn bonus-btn--malus" data-joueur="A" data-type="malus">
              <span class="bonus-btn__icon" aria-hidden="true">👎</span>
              <span class="bonus-btn__label">Malus</span>
              <span class="bonus-btn__detail">0x · 0%</span>
            </button>
          </div>
        </section>

        <button
          type="button"
          class="btn btn--ghost bonus-undo-btn"
          id="btn-undo"
          disabled
          aria-label="Annuler le dernier clic"
        >
          ↩ Annuler
        </button>

        <section class="card bonus-joueur bonus-joueur--b" aria-labelledby="lbl-joueur-b">
          <div class="bonus-joueur__head">
            <label class="field-label" for="bonus-name-b">Joueur B</label>
            <input type="text" id="bonus-name-b" class="bonus-joueur__titre-input" maxlength="60" value="Joueur B" aria-labelledby="lbl-joueur-b" />
            <p class="bonus-score-wrap">
              <span class="bonus-score" id="score-b">0</span>
              <span class="bonus-score-unit">pts</span>
            </p>
          </div>
          <div class="bonus-btns" role="group" aria-label="Actions joueur B">
            <button type="button" class="bonus-btn bonus-btn--bonus" data-joueur="B" data-type="bonus">
              <span class="bonus-btn__icon" aria-hidden="true">👍</span>
              <span class="bonus-btn__label">Bonus</span>
              <span class="bonus-btn__detail">0x · 0%</span>
            </button>
            <button type="button" class="bonus-btn bonus-btn--normal" data-joueur="B" data-type="normal">
              <span class="bonus-btn__icon" aria-hidden="true">➕</span>
              <span class="bonus-btn__label">Point</span>
              <span class="bonus-btn__detail">0x · 0%</span>
            </button>
            <button type="button" class="bonus-btn bonus-btn--malus" data-joueur="B" data-type="malus">
              <span class="bonus-btn__icon" aria-hidden="true">👎</span>
              <span class="bonus-btn__label">Malus</span>
              <span class="bonus-btn__detail">0x · 0%</span>
            </button>
          </div>
        </section>
      </div>

      <div class="card eleve-share-bar" id="eleve-share-bar"></div>
    </div>

    <script src="../vendor/lz-string.min.js"></script>
    <script src="../shared/qr-exchange-core.js"></script>
    <script src="../shared/eleve-labels.js"></script>
    <script src="../vendor/qrcode.min.js"></script>
    <script src="../shared/qr-share-ui.js"></script>
    <script src="../data-manager.js"></script>
    <script src="compteur-bonus.js"></script>
    <script src="../tool-info.js"></script>
    <script>
      ToolInfo.init({
        intro: "Comptez les points bonus, normaux et malus pour deux joueurs en même temps.",
        sections: [
          {
            title: "L’intérêt principal",
            text:
              "Pendant un duel ou une observation, vous notez chaque action d’un joueur en un clic et le score se calcule tout seul.",
          },
          {
            title: "Comment s’en servir",
            list: [
              "Réglez d’abord la valeur des points (bonus, point normal, malus négatif ou positif).",
              "Joueur A en haut, joueur B en bas : appuyez sur 👍, ➕ ou 👎 selon l’action.",
              "Chaque bouton affiche le nombre d’actions (ex. 3x), le pourcentage et les points gagnés.",
              "« Annuler » corrige la dernière action.",
            ],
          },
        ],
      });
    </script>
    <script src="../pwa-register.js" data-sw="../sw.js"></script>
  </body>
</html>
