<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a2744" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Outils EPS" />
    <title>Oubli de matériel — Outils EPS</title>
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="../style.css" />
    <script src="../pwa-splash.js"></script>
  </head>
  <body class="app app--tool">
    <div class="page-outil">
      <header class="page-outil__header">
        <a class="tool-back" href="../index.html"
          ><span class="tool-back__chev" aria-hidden="true">‹</span> Accueil</a
        >
        <h1>Oubli de matériel</h1>
      </header>

      <div class="dispense-nav" role="tablist" aria-label="Affichage oubli de matériel">
        <button
          type="button"
          class="dispense-nav__btn dispense-nav__btn--active dispense-nav__btn--icon"
          role="tab"
          id="tab-liste"
          aria-selected="true"
          aria-controls="oubli-panel-liste"
          tabindex="0"
        >
          <span class="btn-icon-emoji" aria-hidden="true">📋</span>
          <span class="sr-only">Liste des oublis de matériel</span>
        </button>
        <button
          type="button"
          class="dispense-nav__btn dispense-nav__btn--icon"
          role="tab"
          id="tab-form"
          aria-selected="false"
          aria-controls="oubli-panel-form"
          tabindex="-1"
        >
          <span class="btn-icon-emoji" aria-hidden="true">➕</span>
          <span class="sr-only">Ajouter un oubli de matériel</span>
        </button>
      </div>
      <p id="oubli-feedback" class="dispense-feedback" role="status" aria-live="polite" hidden></p>

      <div
        id="oubli-panel-liste"
        class="dispense-view"
        role="tabpanel"
        aria-labelledby="tab-liste"
      >
        <section class="card" aria-labelledby="lbl-liste">
          <h2 id="lbl-liste">Liste des oublis</h2>
          <div class="filter-bar field-group">
            <label class="field-label" for="filtre-liste">Filtrer (nom, prénom, classe)</label>
            <input type="search" id="filtre-liste" placeholder="Tapez pour filtrer…" autocomplete="off" />
          </div>
          <div id="liste-oublis" aria-live="polite"></div>
        </section>
      </div>

      <div
        id="oubli-panel-form"
        class="dispense-view"
        role="tabpanel"
        aria-labelledby="tab-form"
        hidden
      >
        <section class="card" aria-labelledby="form-titre">
          <h2 id="form-titre">Nouvel oubli de matériel</h2>
          <p id="form-msg" class="msg-error" role="alert" hidden></p>
          <p id="form-ok" class="msg-ok" role="status" hidden></p>

          <button
            type="button"
            class="btn btn--ghost btn--labeled dispense-import-classe"
            id="btn-import-eleve-classe"
          >
            <span class="btn__icon" aria-hidden="true">👥</span>
            <span class="btn__text">Importer un élève depuis une classe</span>
          </button>
          <p class="hint dispense-import-hint">
            Remplit automatiquement le nom, le prénom et la classe à partir d’une classe enregistrée.
          </p>

          <form id="form-oubli" novalidate>
            <input type="hidden" id="edit-id" value="" />
            <input type="hidden" id="eleve-id" value="" />
            <input type="hidden" id="classe-id" value="" />

            <div class="field-group">
              <label class="field-label" for="nom">Nom</label>
              <input type="text" id="nom" name="nom" required autocomplete="family-name" />
            </div>
            <div class="field-group">
              <label class="field-label" for="prenom">Prénom</label>
              <input type="text" id="prenom" name="prenom" required autocomplete="given-name" />
            </div>
            <div class="field-group">
              <label class="field-label" for="classe">Classe</label>
              <input type="text" id="classe" name="classe" required placeholder="ex. 3e A" />
            </div>
            <div class="field-group">
              <label class="field-label" for="date-oubli">Date de l’oubli</label>
              <input
                type="text"
                id="date-oubli"
                name="date-oubli"
                required
                inputmode="numeric"
                placeholder="jj/mm/aaaa"
                maxlength="10"
                autocomplete="off"
              />
            </div>
            <div class="field-group">
              <label class="field-label" for="commentaire">Commentaire (facultatif)</label>
              <textarea id="commentaire" name="commentaire" rows="3" placeholder="Ex. chaussures, tenue, gourde…"></textarea>
            </div>
            <div class="field-row field-row--actions">
              <button
                type="submit"
                class="btn btn--primary btn--icon-only"
                id="btn-submit"
                aria-label="Enregistrer l'oubli de matériel"
              >
                <span class="btn-icon-emoji" aria-hidden="true">💾</span>
              </button>
              <button
                type="button"
                class="btn btn--ghost btn--icon-only"
                id="btn-reset-form"
                hidden
                aria-label="Annuler la modification"
              >
                <span class="btn-icon-emoji" aria-hidden="true">↩️</span>
              </button>
            </div>
          </form>
        </section>
      </div>
    </div>

    <script src="../shared/outils-dom.js"></script>
    <script src="../data-manager.js"></script>
    <script src="../shared/eleve-display.js"></script>
    <script src="../class-import.js"></script>
    <script src="oubli-materiel.js"></script>
    <script src="../tool-info.js"></script>
    <script>
      ToolInfo.init({
        intro: "Notez les oublis de matériel et voyez rapidement le numéro d’oubli de chaque élève.",
        sections: [
          {
            title: "L’intérêt principal",
            text:
              "Vous gardez une trace simple des oublis d’affaires, avec le compteur d’oublis par élève.",
          },
          {
            title: "Comment s’en servir",
            list: [
              "Ajoutez un oubli manuellement ou importez l’élève depuis une classe enregistrée.",
              "La vue principale indique automatiquement s’il s’agit de l’oubli n°1, n°2, etc.",
              "Filtrez par nom, prénom ou classe pour retrouver rapidement un élève.",
            ],
          },
        ],
      });
    </script>
    <script src="../shared/tool-accueil.js"></script>
    <script src="../goatcounter.js"></script>
    <script src="../pwa-register.js" data-sw="../sw.js"></script>
  </body>
</html>
