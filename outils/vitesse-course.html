<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="canonical" href="https://www.outilseps.fr/outils/vitesse-course.html" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a2744" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Outils EPS" />
    <title>Vitesse de course — Outils EPS</title>
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="app app--tool">
    <div class="page-outil page-outil--vitesse">
      <header class="page-outil__header">
        <a class="tool-back" href="../index.html"
          ><span class="tool-back__chev" aria-hidden="true">‹</span> Accueil</a
        >
        <h1>Vitesse de course</h1>
      </header>

      <section class="card" aria-labelledby="lbl-saisie">
        <h2 id="lbl-saisie">Distance et temps</h2>
        <p class="hint">
          Indiquez la <strong>distance parcourue</strong> et le <strong>temps</strong> : la vitesse et
          l’allure se mettent à jour automatiquement.
        </p>

        <div class="field-row field-row--vitesse-distance">
          <div class="field-group field-group--grow">
            <label class="field-label" for="distance">Distance</label>
            <input type="number" id="distance" inputmode="decimal" min="0" step="any" placeholder="ex. 1000" autocomplete="off" />
          </div>
          <div class="field-group field-group--unite">
            <label class="field-label" for="unite-distance">Unité</label>
            <select id="unite-distance">
              <option value="m" selected>mètres</option>
              <option value="km">kilomètres</option>
            </select>
          </div>
        </div>
        <div class="field-row field-row--vitesse-temps">
          <div class="field-group">
            <label class="field-label" for="temps-min">Temps — minutes</label>
            <input type="number" id="temps-min" inputmode="numeric" min="0" step="1" placeholder="3" autocomplete="off" />
          </div>
          <div class="field-group">
            <label class="field-label" for="temps-sec">Secondes</label>
            <input type="number" id="temps-sec" inputmode="numeric" min="0" max="59" step="1" placeholder="45" autocomplete="off" />
          </div>
        </div>
        <p id="vitesse-msg" class="msg-error" role="alert" hidden></p>
      </section>
      <section class="card" id="section-resultats" aria-labelledby="lbl-resultats" hidden>
        <h2 id="lbl-resultats">Résultats</h2>
        <div class="vitesse-resultats">
          <div class="result-box vitesse-result-box">
            <span class="vitesse-result-label">Vitesse</span>
            <strong id="resultat-kmh">—</strong>
            <span class="vitesse-result-unit">km/h</span>
          </div>
          <div class="result-box vitesse-result-box">
            <span class="vitesse-result-label">Allure</span>
            <strong id="resultat-allure">—</strong>
            <span class="vitesse-result-unit">min/km</span>
          </div>
          <div class="result-box vitesse-result-box">
            <span class="vitesse-result-label">Vitesse</span>
            <strong id="resultat-ms">—</strong>
            <span class="vitesse-result-unit">m/s</span>
          </div>
        </div>
      </section>
    </div>
    <script src="vitesse-course.js"></script>
    <script src="../tool-info.js"></script>
    <script>
      ToolInfo.init({
        intro: "Calculez la vitesse ou l’allure d’un élève à partir d’une distance et d’un temps.",
        sections: [
          {
            title: "L’intérêt principal",
            text:
              "Après un test (VMA, course, fractionné…), vous obtenez tout de suite la vitesse en km/h, en m/s et l’allure en min/km.",
          },
          {
            title: "Comment s’en servir",
            list: [
              "Indiquez la distance parcourue (en mètres ou en kilomètres).",
              "Saisissez le temps en minutes et secondes.",
              "Les résultats se mettent à jour automatiquement.",
            ],
          },
        ],
      });
    </script>
    <script src="../shared/tool-accueil.js"></script>
    <script src="../goatcounter.js"></script>
    <script src="../pwa-register.js" data-sw="../sw.js"></script>
  </body>
</html>
