<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a2744" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Outils EPS" />
    <title>Table de marque — Outils EPS</title>
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="app app--tool">
    <div class="page-outil page-outil--table-marque">
      <header class="page-outil__header table-marque-header">
        <a class="tool-back" href="../index.html"
          ><span class="tool-back__chev" aria-hidden="true">‹</span> Accueil</a
        >
        <h1>Table de marque</h1>
      </header>

      <details class="card card--accordion table-marque-reglages" id="table-reglages" open>
        <summary class="card--accordion__summary">
          <span class="card--accordion__title">Réglages du timer</span>
          <span class="card--accordion__chev" aria-hidden="true"></span>
        </summary>
        <div class="card--accordion__panel">
          <p class="hint">
            Réglez la durée du match ou de la période. Le timer est indépendant des scores.
          </p>
          <div class="field-row table-reglages-row">
            <div class="field-group">
              <label class="field-label" for="table-min">Minutes</label>
              <input type="number" id="table-min" min="0" max="999" step="1" inputmode="numeric" value="8" />
            </div>
            <div class="field-group">
              <label class="field-label" for="table-sec">Secondes</label>
              <input type="number" id="table-sec" min="0" max="59" step="1" inputmode="numeric" value="0" />
            </div>
          </div>
        </div>
      </details>

      <section class="card table-timer-card" aria-labelledby="lbl-table-timer">
        <h2 id="lbl-table-timer">Timer</h2>
        <p class="table-timer-label" id="table-timer-label">Prêt</p>
        <p class="table-timer-time" id="table-time" aria-live="polite">08:00</p>
        <div class="table-actions">
          <button type="button" class="btn btn--primary btn--labeled" id="table-timer-main">
            <span class="btn__icon" aria-hidden="true">▶</span>
            <span class="btn__text">Démarrer</span>
          </button>
          <button type="button" class="btn btn--ghost btn--labeled" id="table-reset-timer">
            <span class="btn__icon" aria-hidden="true">↺</span>
            <span class="btn__text">Remise à zéro chrono</span>
          </button>
        </div>
        <p id="table-msg" class="msg-error" role="alert" hidden></p>
      </section>

      <section class="table-scoreboard" aria-label="Scores">
        <article class="card table-team table-team--left" data-team-card="left">
          <div class="table-team__top">
            <input
              type="text"
              class="table-team__name-input"
              id="team-left-name"
              value="Équipe A"
              aria-label="Nom de l'équipe A"
            />
            <button type="button" class="table-minus-btn" data-team="left" aria-label="Retirer 1 point à l'équipe A">
              −1
            </button>
          </div>
          <label class="table-color-label">
            <span>Couleur</span>
            <input type="color" id="team-left-color" value="#0d9488" aria-label="Couleur de l'équipe A" />
          </label>
          <p class="table-team__score" id="score-left">0</p>
          <button type="button" class="table-score-btn" data-team="left" aria-label="Ajouter 1 point à l'équipe A">
            +1
          </button>
        </article>

        <article class="card table-team table-team--right" data-team-card="right">
          <div class="table-team__top">
            <input
              type="text"
              class="table-team__name-input"
              id="team-right-name"
              value="Équipe B"
              aria-label="Nom de l'équipe B"
            />
            <button type="button" class="table-minus-btn" data-team="right" aria-label="Retirer 1 point à l'équipe B">
              −1
            </button>
          </div>
          <label class="table-color-label">
            <span>Couleur</span>
            <input type="color" id="team-right-color" value="#6366f1" aria-label="Couleur de l'équipe B" />
          </label>
          <p class="table-team__score" id="score-right">0</p>
          <button type="button" class="table-score-btn" data-team="right" aria-label="Ajouter 1 point à l'équipe B">
            +1
          </button>
        </article>
      </section>

      <button type="button" class="btn btn--danger btn--labeled table-reset-scores" id="table-reset-scores">
        <span class="btn__icon" aria-hidden="true">🗑</span>
        <span class="btn__text">Effacer tous les scores</span>
      </button>

      <div class="card eleve-share-bar" id="eleve-share-bar"></div>
    </div>

    <script src="../vendor/lz-string.min.js"></script>
    <script src="../shared/qr-exchange-core.js"></script>
    <script src="../shared/eleve-labels.js"></script>
    <script src="../vendor/qrcode.min.js"></script>
    <script src="../shared/qr-share-ui.js"></script>
    <script src="table-marque.js"></script>
    <script src="../tool-info.js"></script>
    <script>
      ToolInfo.init({
        intro: "Une table de marque simple pour les sports collectifs : scores, couleurs d’équipes et timer.",
        sections: [
          {
            title: "L’intérêt principal",
            text:
              "Pendant un match, vous gardez les deux scores visibles, avec noms et couleurs personnalisables pour chaque équipe.",
          },
          {
            title: "Comment s’en servir",
            list: [
              "Réglez la durée dans l’accordéon si vous utilisez le timer.",
              "Renommez les équipes et choisissez leur couleur.",
              "Appuyez sur +1 à gauche ou à droite pour ajouter un point.",
              "Le bouton −1 à côté du nom retire un point à l’équipe concernée.",
              "« Remise à zéro chrono » remet seulement le timer au départ.",
              "« Effacer tous les scores » remet les scores des deux équipes à zéro.",
            ],
          },
        ],
      });
    </script>
    <script src="../pwa-register.js" data-sw="../sw.js"></script>
  </body>
</html>
