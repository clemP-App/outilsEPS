<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="canonical" href="https://www.outilseps.fr/outils/catalogue-evaluations.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2744" />
    <title>Catalogue des évaluations — Outils EPS</title>
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="app app--tool">
    <div class="page-outil page-outil--eval-catalog">
      <header class="page-outil__header">
        <a class="tool-back tool-back--return" href="grilles-evaluation.html" aria-label="Retour"
          ><span class="tool-back__chev" aria-hidden="true">‹</span><span class="tool-back__label">Retour</span></a
        >
        <h1>Catalogue des évaluations</h1>
      </header>

      <p class="hint eval-catalog-intro">
        Consultez les grilles publiées, prévisualisez-les et importez-les dans votre bibliothèque.
      </p>

      <p id="eval-catalog-status" class="eval-catalog-status" role="status">
        Chargement du catalogue en ligne...
      </p>

      <section class="eval-catalog-toolbar" aria-label="Recherche et filtres">
        <div class="field-group eval-catalog-search">
          <label class="field-label" for="eval-catalog-search">Rechercher</label>
          <input
            type="search"
            id="eval-catalog-search"
            autocomplete="off"
            placeholder="APSA, cycle, lycée, niveau, auteur..."
          />
        </div>
        <div class="field-group">
          <label class="field-label" for="eval-catalog-cycle">Cycle</label>
          <select id="eval-catalog-cycle">
            <option value="">Tous</option>
            <option value="3">Cycle 3</option>
            <option value="4">Cycle 4</option>
            <option value="lycee">Lycée</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label" for="eval-catalog-sort">Trier</label>
          <select id="eval-catalog-sort">
            <option value="votes">Mieux notées</option>
            <option value="recent">Récentes</option>
            <option value="title">A → Z</option>
          </select>
        </div>
      </section>

      <p id="eval-catalog-count" class="eval-catalog-count" aria-live="polite"></p>
      <p id="eval-catalog-empty" class="empty-state" hidden>
        Aucune grille ne correspond à cette recherche.
      </p>
      <div id="eval-catalog-list" class="eval-catalog-list"></div>
    </div>

    <dialog id="eval-catalog-view-dialog" class="tab-suivi-dialog tab-suivi-dialog--rubric-cell eval-catalog-view-dialog">
      <form method="dialog" class="tab-suivi-dialog__form">
        <header class="tab-suivi-dialog__header tab-suivi-dialog__header--compact">
          <div class="tab-suivi-dialog__header-text">
            <h2 class="tab-suivi-dialog__title" id="eval-catalog-view-title">Grille</h2>
            <p class="tab-suivi-dialog__intro" id="eval-catalog-view-meta"></p>
          </div>
          <button type="button" class="tab-suivi-dialog__close" id="eval-catalog-view-close-x" aria-label="Fermer">
            ×
          </button>
        </header>
        <div class="tab-suivi-dialog__body tab-suivi-rubric-cell-body">
          <div id="eval-catalog-view-grid" class="tab-suivi-rubric-grid-wrap eval-catalog-view-grid"></div>
        </div>
        <footer class="tab-suivi-dialog__footer tab-suivi-dialog__footer--split">
          <button type="button" class="btn btn--ghost" id="eval-catalog-view-import">Importer dans ma bibliothèque</button>
          <button type="button" class="btn btn--primary" id="eval-catalog-view-close">Fermer</button>
        </footer>
      </form>
    </dialog>

    <script src="../data-manager.js"></script>
    <script src="../shared/supabase-config.js"></script>
    <script src="../shared/supabaseClient.js"></script>
    <script src="../shared/catalog-grid-validation.js"></script>
    <script src="../shared/catalog-grids.js"></script>
    <script src="../shared/evaluation-rubric-library.js"></script>
    <script src="catalogue-evaluations.js"></script>
    <script src="../goatcounter.js"></script>
  </body>
</html>
