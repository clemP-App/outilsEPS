        function renderAnswer(container, item) {
          container.textContent = "";
          var parts = item.a.split("\n\n");
          if (parts[0]) {
            var lead = document.createElement("p");
            lead.className = "faq-item__a-lead";
            lead.textContent = parts[0].trim();
            container.appendChild(lead);
          }
          if (parts.length > 1) {
            appendParagraphs(container, parts.slice(1).join("\n\n"), "faq-item__a-p");
          }
          if (item.links && item.links.length) {
            var linksWrap = document.createElement("div");
            linksWrap.className = "faq-item__links";
            item.links.forEach(function (link) {
              var a = document.createElement("a");
              a.className = "btn btn--ghost btn--small";
              a.href = link.href;
              a.textContent = link.label;
              linksWrap.appendChild(a);
            });
            container.appendChild(linksWrap);
          }
          if (item.details) {
            var det = document.createElement("details");
            det.className = "faq-item__more";
            var sum = document.createElement("summary");
            sum.textContent = item.detailsLabel || "En savoir plus";
            det.appendChild(sum);
            var detBody = document.createElement("div");
            detBody.className = "faq-item__more-body";
            appendParagraphs(detBody, item.details, "faq-item__more-p");
            det.appendChild(detBody);
            container.appendChild(det);
          }
        }

        function renderFaqItem(item) {
          var d = document.createElement("details");
          d.className = "faq-item";
          if (item.id) d.id = item.id;
          var s = document.createElement("summary");
          var catSpan = document.createElement("span");
          catSpan.className = "faq-item__cat";
          catSpan.textContent = LABELS[item.cat] || "FAQ";
          var qSpan = document.createElement("span");
          qSpan.className = "faq-item__q";
          qSpan.textContent = item.q;
          s.appendChild(catSpan);
          s.appendChild(qSpan);
          var body = document.createElement("div");
          body.className = "faq-item__a";
          renderAnswer(body, item);
          d.appendChild(s);
          d.appendChild(body);
          return d;
        }

        function applyHash() {
          var hashId = (location.hash || "").replace(/^#/, "");
          if (!hashId) return;
          var target = document.getElementById(hashId);
          if (target && target.classList.contains("faq-item")) {
            target.open = true;
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }

        function openFaqItem(id) {
          state.filter = "all";
          state.q = "";
          search.value = "";
          updateFilterButtons();
          render();
          applyHash();
          if (!location.hash || location.hash.replace(/^#/, "") !== id) {
            history.replaceState(null, "", "#" + id);
          }
          var target = document.getElementById(id);
          if (target) {
            target.open = true;
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }

        function render() {
          var rows = FAQ_DATA.filter(matchItem);
          list.textContent = "";
          if (!rows.length) {
            var empty = document.createElement("div");
            empty.className = "empty-state";
            var p = document.createElement("p");
            p.textContent = "Aucun résultat.";
            var hint = document.createElement("p");
            hint.className = "faq-empty-hint";
            hint.textContent = "Essayez : sauvegarde, QR, classe, appel, dossier élève.";
            empty.appendChild(p);
            empty.appendChild(hint);
            list.appendChild(empty);
          } else {
            rows.forEach(function (item) {
              list.appendChild(renderFaqItem(item));
            });
          }
          var filterLabel = FILTER_DEFS.find(function (f) {
            return f.id === state.filter;
          });
          var suffix = state.q ? " (recherche active)" : "";
          count.textContent =
            rows.length +
            " question(s) affichée(s)" +
            (filterLabel && state.filter !== "all" ? " — filtre « " + filterLabel.label + " »" : "") +
            suffix +
            ".";
          applyHash();
        }

        function updateFilterButtons() {
          filtersEl.querySelectorAll(".faq-filter").forEach(function (btn) {
            var active = btn.getAttribute("data-filter") === state.filter;
            btn.classList.toggle("is-active", active);
            btn.setAttribute("aria-pressed", active ? "true" : "false");
          });
        }

        function renderFilters() {
          filtersEl.textContent = "";
          FILTER_DEFS.forEach(function (def) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "btn btn--ghost btn--small faq-filter";
            btn.setAttribute("data-filter", def.id);
            btn.setAttribute("aria-pressed", def.id === state.filter ? "true" : "false");
            if (def.id === state.filter) btn.classList.add("is-active");
            btn.textContent = def.label;
            btn.addEventListener("click", function () {
              state.filter = def.id;
              updateFilterButtons();
              render();
            });
            filtersEl.appendChild(btn);
          });
        }

        function renderPriority() {
          priorityEl.textContent = "";
          PRIORITY_CARDS.forEach(function (card) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "faq-priority-card";
            btn.textContent = card.label;
            btn.addEventListener("click", function () {
              openFaqItem(card.id);
            });
            priorityEl.appendChild(btn);
          });
        }

        search.addEventListener("input", function () {
          state.q = normaliseFaqText((search.value || "").trim());
          render();
        });

        expandAllBtn.addEventListener("click", function () {
          list.querySelectorAll(".faq-item").forEach(function (d) {
            d.open = true;
          });
        });

        collapseAllBtn.addEventListener("click", function () {
          list.querySelectorAll(".faq-item").forEach(function (d) {
            d.open = false;
          });
        });

        window.addEventListener("hashchange", applyHash);

        renderFilters();
        renderPriority();
        render();
      })();
    </script>
  </body>
</html>
